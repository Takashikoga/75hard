<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>75 HARD — Taki & Jessica</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Barlow:wght@300;400;500;600;700&family=Barlow+Condensed:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0a0a0f;--surface:#12121a;--surface2:#1a1a26;--border:#2a2a3d;
  --accent:#ff4d4d;--accent2:#ff8c42;--gold:#ffd166;--green:#06d6a0;
  --blue:#4cc9f0;--text:#f0f0f5;--muted:#6b6b8a;--taki:#4cc9f0;--jessica:#ff8c42;
}
.light-mode {
  --bg:#f0f4f8;--surface:#ffffff;--surface2:#e8edf2;--border:#d0d8e4;
  --text:#1a1a2e;--muted:#7a8499;--surface2:#edf2f7;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);color:var(--text);font-family:'Barlow',sans-serif;min-height:100vh;overflow-x:hidden;transition:background 0.3s,color 0.3s;}
body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");pointer-events:none;z-index:0;opacity:0.4;}
.app{position:relative;z-index:1;}

/* HEADER */
header{background:linear-gradient(135deg,#0a0a0f 0%,#12121a 100%);border-bottom:1px solid var(--border);padding:14px 16px 10px;position:sticky;top:0;z-index:100;backdrop-filter:blur(10px);}
.light-mode header{background:linear-gradient(135deg,#1a1a2e,#16213e);}
.header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.logo{font-family:'Black Ops One',cursive;font-size:20px;letter-spacing:2px;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.header-right{display:flex;align-items:center;gap:8px;}
.day-badge{background:var(--accent);color:white;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:12px;padding:4px 10px;border-radius:20px;letter-spacing:1px;}
.icon-btn{background:rgba(255,255,255,0.08);border:none;color:var(--text);width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;}
.names-bar{display:flex;gap:8px;}
.person-tab{flex:1;padding:8px 12px;border-radius:10px;border:2px solid transparent;cursor:pointer;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:15px;letter-spacing:1px;text-transform:uppercase;transition:all 0.2s;text-align:center;}
.person-tab.taki{border-color:var(--taki);color:var(--taki);background:transparent;}
.person-tab.jessica{border-color:var(--jessica);color:var(--jessica);background:transparent;}
.person-tab.active.taki{background:var(--taki);color:#000;}
.person-tab.active.jessica{background:var(--jessica);color:#000;}

/* NAV */
.nav-tabs{display:flex;background:var(--surface);border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none;}
.nav-tabs::-webkit-scrollbar{display:none;}
.nav-tab{flex:none;padding:11px 16px;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;transition:all 0.2s;white-space:nowrap;}
.nav-tab.active{color:var(--text);border-bottom-color:var(--accent);}

.content{padding:14px;max-width:500px;margin:0 auto;}

/* ALERT BANNER */
.alert-banner{background:linear-gradient(135deg,rgba(255,77,77,0.2),rgba(255,140,66,0.2));border:1px solid rgba(255,77,77,0.4);border-radius:12px;padding:12px 14px;margin-bottom:14px;display:flex;align-items:center;gap:10px;}
.alert-banner .alert-icon{font-size:22px;}
.alert-banner .alert-text{flex:1;font-size:13px;font-weight:600;color:var(--accent);}

/* QUOTE CARD */
.quote-card{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--gold);border-radius:12px;padding:14px 16px;margin-bottom:14px;}
.quote-text{font-style:italic;font-size:14px;line-height:1.6;color:var(--text);margin-bottom:4px;}
.quote-author{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:1px;text-transform:uppercase;}

/* STAT CARDS */
.overview-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;position:relative;overflow:hidden;}
.stat-card::after{content:'';position:absolute;top:0;right:0;width:60px;height:60px;border-radius:0 14px 0 60px;opacity:0.08;}
.stat-card.streak::after{background:var(--gold);}
.stat-card.days::after{background:var(--green);}
.stat-card.completion::after{background:var(--blue);}
.stat-card.restart::after{background:var(--accent);}
.stat-label{font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:4px;}
.stat-value{font-family:'Black Ops One',cursive;font-size:30px;line-height:1;}
.stat-value.gold{color:var(--gold);}
.stat-value.green{color:var(--green);}
.stat-value.blue{color:var(--blue);}
.stat-value.red{color:var(--accent);}

/* PROGRESS */
.progress-section{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:14px;}
.progress-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.progress-title{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:14px;letter-spacing:1px;text-transform:uppercase;}
.progress-pct{font-family:'Black Ops One',cursive;font-size:18px;color:var(--accent);}
.progress-bar{height:8px;background:var(--border);border-radius:10px;overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:10px;transition:width 0.5s ease;}

/* DAY GRID */
.days-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-bottom:14px;}
.day-dot{aspect-ratio:1;border-radius:7px;display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:11px;cursor:pointer;border:1.5px solid var(--border);background:var(--surface);color:var(--muted);transition:all 0.15s;}
.day-dot.complete{background:var(--green);border-color:var(--green);color:#000;}
.day-dot.partial{background:var(--accent2);border-color:var(--accent2);color:#000;}
.day-dot.failed{background:var(--accent);border-color:var(--accent);color:white;}
.day-dot.today{border-color:var(--gold);color:var(--gold);box-shadow:0 0 8px rgba(255,209,102,0.3);}
.day-dot.future{opacity:0.3;cursor:default;}

/* TODAY CARD */
.today-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden;margin-bottom:14px;}
.today-header{background:linear-gradient(135deg,var(--surface2),var(--surface));padding:12px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.today-title{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:17px;letter-spacing:1px;text-transform:uppercase;}
.today-date{font-size:11px;color:var(--muted);font-weight:500;}
.task-row{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;cursor:pointer;transition:background 0.15s;}
.task-row:last-child{border-bottom:none;}
.task-row:active{background:var(--surface2);}
.task-icon{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;}
.task-info{flex:1;min-width:0;}
.task-name{font-weight:600;font-size:14px;margin-bottom:1px;}
.task-sub{font-size:11px;color:var(--muted);}
.task-check{width:26px;height:26px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 0.2s;font-size:12px;}
.task-check.done{background:var(--green);border-color:var(--green);}

/* WATER */
.water-section{padding:12px 14px;border-bottom:1px solid var(--border);}
.water-label{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:1px;text-transform:uppercase;margin-bottom:8px;}
.water-cups{display:flex;gap:5px;flex-wrap:wrap;}
.water-cup{width:34px;height:42px;border-radius:6px;border:2px solid var(--border);background:var(--surface2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:17px;transition:all 0.2s;}
.water-cup.filled{border-color:var(--blue);background:var(--blue);}
.water-count{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:12px;color:var(--blue);margin-top:6px;}

/* MEALS */
.meals-section{padding:12px 14px;border-bottom:1px solid var(--border);}
.section-label{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:1px;text-transform:uppercase;margin-bottom:8px;}
.meal-entry{background:var(--surface2);border-radius:9px;padding:9px 11px;margin-bottom:6px;display:flex;align-items:flex-start;gap:8px;}
.meal-time{font-size:10px;color:var(--muted);font-weight:600;letter-spacing:1px;width:58px;flex-shrink:0;padding-top:2px;}
.meal-desc{flex:1;font-size:13px;color:var(--text);}
.meal-delete{background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px;padding:0;line-height:1;}
.add-meal-form{display:flex;gap:6px;margin-top:6px;}
.add-meal-time,.add-meal-input{background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'Barlow',sans-serif;font-size:13px;padding:8px 10px;}
.add-meal-time{width:78px;}
.add-meal-input{flex:1;}
.add-meal-time::placeholder,.add-meal-input::placeholder{color:var(--muted);}
.add-meal-input:focus,.add-meal-time:focus{outline:none;border-color:var(--accent);}
.add-btn{background:var(--accent);border:none;color:white;border-radius:8px;width:34px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}

/* MACROS */
.macros-row{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px;}
.macro-input-wrap{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 8px;text-align:center;}
.macro-lbl{font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:3px;}
.macro-input{background:transparent;border:none;color:var(--text);font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:16px;width:100%;text-align:center;outline:none;}
.macro-unit{font-size:9px;color:var(--muted);}

/* BOOK */
.book-section{padding:12px 14px;border-bottom:1px solid var(--border);}
.book-row{display:flex;align-items:center;gap:10px;}
.book-icon{font-size:26px;}
.book-info{flex:1;}
.book-title-text{font-weight:600;font-size:13px;}
.book-page-track{font-size:11px;color:var(--muted);margin-top:1px;}
.pages-input-row{display:flex;gap:6px;margin-top:8px;}
.pages-input{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'Barlow',sans-serif;font-size:13px;padding:8px 10px;}
.pages-input:focus{outline:none;border-color:var(--blue);}
.pages-btn{background:var(--blue);border:none;color:#000;border-radius:8px;padding:8px 12px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:13px;cursor:pointer;}
.book-name-input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'Barlow',sans-serif;font-size:13px;padding:8px 10px;margin-bottom:6px;}
.book-name-input:focus{outline:none;border-color:var(--blue);}

/* HEALTH */
.health-section{padding:12px 14px;border-bottom:1px solid var(--border);}
.health-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;}
.health-input-wrap{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:8px 10px;}
.health-lbl{font-size:10px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:4px;}
.health-input{background:transparent;border:none;color:var(--text);font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:20px;width:100%;outline:none;}
.health-unit{font-size:10px;color:var(--muted);}

/* MOOD */
.mood-section{padding:12px 14px;border-bottom:1px solid var(--border);}
.mood-grid{display:flex;gap:6px;}
.mood-btn{flex:1;padding:8px 4px;border-radius:10px;border:2px solid var(--border);background:var(--surface2);cursor:pointer;text-align:center;transition:all 0.2s;}
.mood-btn .mood-emoji{font-size:20px;display:block;margin-bottom:3px;}
.mood-btn .mood-label{font-size:9px;font-weight:600;letter-spacing:0.5px;text-transform:uppercase;color:var(--muted);}
.mood-btn.selected{border-color:var(--gold);background:rgba(255,209,102,0.1);}

/* WORKOUT */
.workout-row{display:flex;gap:6px;margin-bottom:6px;}
.workout-chip{flex:1;padding:9px 6px;border-radius:9px;border:2px solid var(--border);background:var(--surface2);color:var(--muted);font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:12px;letter-spacing:1px;text-transform:uppercase;text-align:center;cursor:pointer;transition:all 0.2s;}
.workout-chip.done{border-color:var(--green);background:rgba(6,214,160,0.15);color:var(--green);}
.workout-detail{background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'Barlow',sans-serif;font-size:13px;padding:8px 10px;width:100%;margin-top:4px;}
.workout-detail::placeholder{color:var(--muted);}
.workout-detail:focus{outline:none;border-color:var(--green);}

/* TIMER */
.timer-section{padding:12px 14px;border-bottom:1px solid var(--border);}
.timer-display{text-align:center;padding:16px 0;}
.timer-time{font-family:'Black Ops One',cursive;font-size:52px;letter-spacing:2px;line-height:1;}
.timer-label{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:2px;text-transform:uppercase;margin-top:4px;}
.timer-ring{width:120px;height:120px;margin:0 auto 12px;position:relative;}
.timer-ring svg{transform:rotate(-90deg);}
.timer-ring-bg{fill:none;stroke:var(--border);stroke-width:6;}
.timer-ring-fill{fill:none;stroke:var(--green);stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset 1s linear;}
.timer-time-inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.timer-controls{display:flex;gap:8px;}
.timer-btn{flex:1;padding:11px;border-radius:10px;border:none;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:14px;letter-spacing:1px;cursor:pointer;}
.timer-btn.start{background:var(--green);color:#000;}
.timer-btn.stop{background:var(--accent);color:white;}
.timer-btn.reset{background:var(--surface2);border:1px solid var(--border);color:var(--muted);}
.timer-select{display:flex;gap:6px;margin-bottom:10px;}
.timer-preset{flex:1;padding:7px;border-radius:8px;border:1.5px solid var(--border);background:var(--surface2);color:var(--muted);font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:12px;text-align:center;cursor:pointer;transition:all 0.2s;}
.timer-preset.active{border-color:var(--green);color:var(--green);}

/* PHOTOS */
.photos-section{padding:12px 14px;}
.photos-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;}
.photo-slot{aspect-ratio:3/4;background:var(--surface2);border:2px dashed var(--border);border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:all 0.2s;overflow:hidden;position:relative;}
.photo-slot:active{border-color:var(--accent);}
.photo-slot.has-photo{border-style:solid;border-color:var(--border);}
.photo-slot img{width:100%;height:100%;object-fit:cover;border-radius:9px;}
.photo-slot-label{font-size:10px;color:var(--muted);font-weight:600;letter-spacing:1px;text-transform:uppercase;margin-top:7px;}
.photo-plus{font-size:26px;color:var(--muted);}
.photo-overlay{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,0.7));padding:8px;font-size:10px;font-weight:600;letter-spacing:1px;text-align:center;text-transform:uppercase;color:rgba(255,255,255,0.8);}
input[type=file]{display:none;}

/* NOTES */
.notes-section{padding:12px 14px;border-bottom:1px solid var(--border);}
.notes-input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:'Barlow',sans-serif;font-size:13px;padding:10px 12px;min-height:70px;resize:none;line-height:1.5;}
.notes-input::placeholder{color:var(--muted);}
.notes-input:focus{outline:none;border-color:var(--accent);}
.notes-save-btn{margin-top:6px;background:var(--surface2);border:1px solid var(--border);color:var(--muted);padding:7px 14px;border-radius:8px;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:12px;letter-spacing:1px;text-transform:uppercase;cursor:pointer;}

/* COUPLE NOTES */
.couple-section{padding:12px 14px;border-bottom:1px solid var(--border);}
.couple-msg{background:var(--surface2);border-radius:10px;padding:10px 12px;margin-bottom:6px;position:relative;}
.couple-msg-from{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:4px;}
.couple-msg-text{font-size:13px;color:var(--text);line-height:1.5;}
.couple-msg-time{font-size:10px;color:var(--muted);margin-top:3px;}
.couple-msg-delete{position:absolute;top:8px;right:8px;background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px;}
.couple-input-row{display:flex;gap:6px;}
.couple-input{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'Barlow',sans-serif;font-size:13px;padding:8px 10px;}
.couple-input::placeholder{color:var(--muted);}
.couple-input:focus{outline:none;border-color:var(--jessica);}
.couple-send-btn{background:var(--jessica);border:none;color:#000;border-radius:8px;padding:8px 14px;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:13px;cursor:pointer;}

/* BADGES */
.badges-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;}
.badge-item{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 8px;text-align:center;position:relative;overflow:hidden;transition:all 0.2s;}
.badge-item.earned{border-color:var(--gold);}
.badge-item.locked{opacity:0.4;}
.badge-emoji{font-size:26px;margin-bottom:5px;}
.badge-name{font-size:11px;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;color:var(--text);margin-bottom:2px;}
.badge-desc{font-size:10px;color:var(--muted);}
.badge-item.earned::after{content:'✓';position:absolute;top:6px;right:8px;font-size:11px;font-weight:700;color:var(--gold);}

/* HISTORY */
.history-day{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer;transition:all 0.15s;}
.history-day:active{background:var(--surface2);}
.history-day-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.history-day-num{font-family:'Black Ops One',cursive;font-size:18px;}
.history-day-date{font-size:11px;color:var(--muted);}
.history-tasks{display:flex;gap:4px;flex-wrap:wrap;}
.history-task-pill{font-size:10px;font-weight:600;padding:3px 7px;border-radius:20px;letter-spacing:0.5px;}
.pill-done{background:rgba(6,214,160,0.15);color:var(--green);}
.pill-miss{background:rgba(255,77,77,0.15);color:var(--accent);}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:200;display:flex;align-items:flex-end;animation:fadeIn 0.2s ease;}
.modal-overlay.hidden{display:none;}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:var(--surface);border-radius:20px 20px 0 0;padding:18px 18px 40px;width:100%;max-width:500px;margin:0 auto;animation:slideUp 0.3s ease;max-height:90vh;overflow-y:auto;}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-handle{width:40px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 14px;}
.modal-title{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:20px;letter-spacing:1px;text-transform:uppercase;margin-bottom:14px;}
.close-modal-btn{width:100%;padding:13px;background:var(--surface2);border:1px solid var(--border);color:var(--muted);border-radius:12px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:14px;letter-spacing:1px;text-transform:uppercase;cursor:pointer;margin-top:10px;}
.danger-btn{width:100%;padding:13px;background:var(--accent);border:none;color:white;border-radius:12px;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:15px;letter-spacing:1px;text-transform:uppercase;cursor:pointer;margin-bottom:8px;}

/* COMPARE */

<script>
// ═══════════════════════════════════════════
//  DATA LAYER — localStorage first, Firebase syncs in background
// ═══════════════════════════════════════════
const THEME_KEY='75hard_theme';

// --- 75 HARD ---
function defaultDayData(){return {diet:false,workout1:false,workout1Type:'',workout1Note:'',workout2:false,workout2Type:'',workout2Note:'',water:0,pages:0,book:'',photo1:null,photo2:null,photo3:null,meals:[],notes:'',mood:0,weight:'',waist:'',sleep:'',calories:'',protein:'',carbs:'',fat:''};}
function defaultMeta(){return {startDate:null,currentDay:1,restarts:0};}

function getMeta(p){const c=localStorage.getItem(`75hard_meta_${p}`);return c?JSON.parse(c):defaultMeta();}
function saveMeta(p,m){localStorage.setItem(`75hard_meta_${p}`,JSON.stringify(m));fbSet('75hard',`meta_${p}`,m);}
function getDayData(p,d){const c=localStorage.getItem(`75hard_${p}_day${d}`);return c?JSON.parse(c):defaultDayData();}
function saveDayData(p,d,data){
  localStorage.setItem(`75hard_${p}_day${d}`,JSON.stringify(data));
  const {photo1,photo2,photo3,...noPhotos}=data;
  fbSet('75hard',`${p}_day${d}`,noPhotos);
}

// --- 35 HARD ---
function defaultDay35(){return {workout:false,workoutNote:'',water:false,clean:false,noAlcohol:false,steps:false,stepsCount:'',photo:null,notes:'',mood:0};}
function defaultMeta35(){return {startDate:null,restarts:0};}

function getMeta35(p){const c=localStorage.getItem(`35hard_meta_${p}`);return c?JSON.parse(c):defaultMeta35();}
function saveMeta35(p,m){localStorage.setItem(`35hard_meta_${p}`,JSON.stringify(m));fbSet('35hard',`meta_${p}`,m);}
function getDay35Data(p,d){const c=localStorage.getItem(`35hard_${p}_day${d}`);return c?JSON.parse(c):defaultDay35();}
function saveDay35Data(p,d,data){
  localStorage.setItem(`35hard_${p}_day${d}`,JSON.stringify(data));
  const {photo,...noPhoto}=data;
  fbSet('35hard',`${p}_day${d}`,noPhoto);
}

// --- MESSAGES ---
function getMessages(){const c=localStorage.getItem('75hard_couple_msgs');return c?JSON.parse(c):[];}
function saveMessages(msgs){localStorage.setItem('75hard_couple_msgs',JSON.stringify(msgs));fbSet('shared','messages',{msgs});}

// ═══════════════════════════════════════════
//  FIREBASE — loads async, never blocks UI
// ═══════════════════════════════════════════
let db=null;
let fbReady=false;
const fbQueue=[];// queue writes that happen before firebase is ready

function fbSet(collection,docId,data){
  if(!fbReady){fbQueue.push({collection,docId,data});return;}
  try{
    const {setDoc,doc}=window._fbFns;
    setDoc(doc(db,collection,docId),data).catch(e=>console.warn('FB write err:',e));
  }catch(e){console.warn('FB set err:',e);}
}

function fbFlushQueue(){
  while(fbQueue.length>0){
    const item=fbQueue.shift();
    fbSet(item.collection,item.docId,item.data);
  }
}

async function initFirebase(){
  try{
    // Dynamically import Firebase so it never blocks the page
    const {initializeApp}=await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js');
    const {getFirestore,doc,getDoc,setDoc,onSnapshot}=await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js');

    const firebaseConfig={
      apiKey:"AIzaSyDfk8msl0bS3Gi517pDIRmanf4UJVVXvms",
      authDomain:"hard-6333f.firebaseapp.com",
      projectId:"hard-6333f",
      storageBucket:"hard-6333f.firebasestorage.app",
      messagingSenderId:"1098049066413",
      appId:"1:1098049066413:web:439d8a3aea0a6c60b67d24"
    };

    const app=initializeApp(firebaseConfig);
    db=getFirestore(app);
    window._fbFns={setDoc,doc,getDoc,onSnapshot};
    fbReady=true;
    fbFlushQueue();

    showSyncStatus('🔄 Syncing...');

    // Pull all remote data into localStorage
    await pullAllFromFirestore(doc,getDoc);
    showSyncStatus('✅ Synced!',true);

    // Start live listeners
    startListeners(doc,onSnapshot);

  }catch(e){
    console.warn('Firebase failed to load:',e);
    showSyncStatus('📴 Offline mode',false,true);
  }
}

async function pullAllFromFirestore(doc,getDoc){
  try{
    for(const p of['taki','jessica']){
      // 75 Hard meta
      const ms=await getDoc(doc(db,'75hard',`meta_${p}`));
      if(ms.exists())localStorage.setItem(`75hard_meta_${p}`,JSON.stringify(ms.data()));
      // 35 Hard meta
      const ms35=await getDoc(doc(db,'35hard',`meta_${p}`));
      if(ms35.exists())localStorage.setItem(`35hard_meta_${p}`,JSON.stringify(ms35.data()));
      // 75 Hard days
      const dn=getTodayDayNum(p);
      for(let d=1;d<=Math.min(dn+1,75);d++){
        const s=await getDoc(doc(db,'75hard',`${p}_day${d}`));
        if(s.exists()){
          const remote=s.data();
          const localRaw=localStorage.getItem(`75hard_${p}_day${d}`);
          const local=localRaw?JSON.parse(localRaw):defaultDayData();
          localStorage.setItem(`75hard_${p}_day${d}`,JSON.stringify({...local,...remote,photo1:local.photo1,photo2:local.photo2,photo3:local.photo3}));
        }
      }
      // 35 Hard days
      const dn35=getTodayDay35(p);
      for(let d=1;d<=Math.min(dn35+1,35);d++){
        const s=await getDoc(doc(db,'35hard',`${p}_day${d}`));
        if(s.exists()){
          const remote=s.data();
          const localRaw=localStorage.getItem(`35hard_${p}_day${d}`);
          const local=localRaw?JSON.parse(localRaw):defaultDay35();
          localStorage.setItem(`35hard_${p}_day${d}`,JSON.stringify({...local,...remote,photo:local.photo}));
        }
      }
    }
    // Messages
    const ms=await getDoc(doc(db,'shared','messages'));
    if(ms.exists())localStorage.setItem('75hard_couple_msgs',JSON.stringify(ms.data().msgs||[]));
    renderCurrentTab();
  }catch(e){console.warn('Pull err:',e);}
}

function startListeners(doc,onSnapshot){
  try{
    ['taki','jessica'].forEach(p=>{
      // 75 meta
      onSnapshot(doc(db,'75hard',`meta_${p}`),snap=>{
        if(!snap.exists())return;
        localStorage.setItem(`75hard_meta_${p}`,JSON.stringify(snap.data()));
        if(p===activePerson)renderCurrentTab();
      });
      // 35 meta
      onSnapshot(doc(db,'35hard',`meta_${p}`),snap=>{
        if(!snap.exists())return;
        localStorage.setItem(`35hard_meta_${p}`,JSON.stringify(snap.data()));
        if(p===activePerson&&activeMode==='35')renderCurrentTab();
      });
      // 75 today's day
      const dn=getTodayDayNum(p);
      onSnapshot(doc(db,'75hard',`${p}_day${dn}`),snap=>{
        if(!snap.exists())return;
        const remote=snap.data();
        const localRaw=localStorage.getItem(`75hard_${p}_day${dn}`);
        const local=localRaw?JSON.parse(localRaw):defaultDayData();
        localStorage.setItem(`75hard_${p}_day${dn}`,JSON.stringify({...local,...remote,photo1:local.photo1,photo2:local.photo2,photo3:local.photo3}));
        if(p===activePerson&&activeMode==='75')renderCurrentTab();
      });
      // 35 today's day
      const dn35=getTodayDay35(p);
      onSnapshot(doc(db,'35hard',`${p}_day${dn35}`),snap=>{
        if(!snap.exists())return;
        const remote=snap.data();
        const localRaw=localStorage.getItem(`35hard_${p}_day${dn35}`);
        const local=localRaw?JSON.parse(localRaw):defaultDay35();
        localStorage.setItem(`35hard_${p}_day${dn35}`,JSON.stringify({...local,...remote,photo:local.photo}));
        if(p===activePerson&&activeMode==='35')renderCurrentTab();
      });
    });
    // Messages
    onSnapshot(doc(db,'shared','messages'),snap=>{
      if(!snap.exists())return;
      localStorage.setItem('75hard_couple_msgs',JSON.stringify(snap.data().msgs||[]));
      const el=document.getElementById('coupleMsgs');
      if(el)el.innerHTML=renderCoupleMessages(getTodayDayNum(activePerson));
    });
  }catch(e){console.warn('Listener err:',e);}
}

function showSyncStatus(msg,fade=false,warn=false){
  let el=document.getElementById('syncStatus');
  if(!el){
    el=document.createElement('div');
    el.id='syncStatus';
    el.style.cssText='position:fixed;bottom:16px;right:16px;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:6px 14px;font-size:11px;font-weight:700;letter-spacing:1px;z-index:500;transition:opacity 0.5s;pointer-events:none;';
    document.body.appendChild(el);
  }
  el.textContent=msg;
  el.style.color=warn?'var(--accent)':'var(--green)';
  el.style.opacity='1';
  if(fade)setTimeout(()=>{el.style.opacity='0';},2500);
}

// ═══════════════════════════════════════════
//  REAL-TIME SYNC — pull changes from other phone
// ═══════════════════════════════════════════
let _syncPaused=false; // pause sync while user is actively typing

function startRealtimeSync(){
  // Sync 75 Hard data for both people
  ['taki','jessica'].forEach(p=>{
    // Meta
    onSnapshot(doc(db,'75hard',`meta_${p}`),snap=>{
      if(!snap.exists()||_syncPaused)return;
      const remote=snap.data();
      const local=getMeta(p);
      // Only update if remote is newer (has a startDate we don't have, or more restarts)
      if(JSON.stringify(remote)!==JSON.stringify(local)){
        localStorage.setItem(`75hard_meta_${p}`,JSON.stringify(remote));
        if(p===activePerson)renderCurrentTab();
      }
    });

    // Day data — listen to all days 1-75
    for(let d=1;d<=75;d++){
      onSnapshot(doc(db,'75hard',`${p}_day${d}`),snap=>{
        if(!snap.exists()||_syncPaused)return;
        const remote=snap.data();
        const localRaw=localStorage.getItem(`75hard_${p}_day${d}`);
        const local=localRaw?JSON.parse(localRaw):defaultDayData();
        // Merge: keep local photos, take remote data
        const merged={...local,...remote,photo1:local.photo1,photo2:local.photo2,photo3:local.photo3};
        localStorage.setItem(`75hard_${p}_day${d}`,JSON.stringify(merged));
        if(p===activePerson&&d===getTodayDayNum(p))renderCurrentTab();
      });
    }

    // 35 Hard meta
    onSnapshot(doc(db,'35hard',`meta_${p}`),snap=>{
      if(!snap.exists()||_syncPaused)return;
      const remote=snap.data();
      const local=getMeta35(p);
      if(JSON.stringify(remote)!==JSON.stringify(local)){
        localStorage.setItem(`35hard_meta_${p}`,JSON.stringify(remote));
        if(p===activePerson&&activeMode==='35')renderCurrentTab();
      }
    });

    // 35 Hard days
    for(let d=1;d<=35;d++){
      onSnapshot(doc(db,'35hard',`${p}_day${d}`),snap=>{
        if(!snap.exists()||_syncPaused)return;
        const remote=snap.data();
        const localRaw=localStorage.getItem(`35hard_${p}_day${d}`);
        const local=localRaw?JSON.parse(localRaw):defaultDay35();
        const merged={...local,...remote,photo:local.photo};
        localStorage.setItem(`35hard_${p}_day${d}`,JSON.stringify(merged));
        if(p===activePerson&&activeMode==='35'&&d===getTodayDay35(p))renderCurrentTab();
      });
    }
  });

  // Messages
  onSnapshot(doc(db,'shared','messages'),snap=>{
    if(!snap.exists()||_syncPaused)return;
    const remote=snap.data().msgs||[];
    const local=getMessages();
    if(JSON.stringify(remote)!==JSON.stringify(local)){
      localStorage.setItem('75hard_couple_msgs',JSON.stringify(remote));
      // Refresh couple messages if on today tab
      const dayNum=getTodayDayNum(activePerson);
      const el=document.getElementById('coupleMsgs');
      if(el)el.innerHTML=renderCoupleMessages(dayNum);
    }
  });
}

// Pull ALL data from Firestore on first load (in case this is a new device)
async function pullAllDataFromFirestore(){
  showSyncStatus('🔄 Syncing data...');
  try{
    for(const p of ['taki','jessica']){
      // Meta 75
      const metaSnap=await getDoc(doc(db,'75hard',`meta_${p}`));
      if(metaSnap.exists()){
        const remote=metaSnap.data();
        localStorage.setItem(`75hard_meta_${p}`,JSON.stringify(remote));
      }
      // Meta 35
      const meta35Snap=await getDoc(doc(db,'35hard',`meta_${p}`));
      if(meta35Snap.exists()){
        localStorage.setItem(`35hard_meta_${p}`,JSON.stringify(meta35Snap.data()));
      }
      // 75 Hard days
      for(let d=1;d<=75;d++){
        const daySnap=await getDoc(doc(db,'75hard',`${p}_day${d}`));
        if(daySnap.exists()){
          const remote=daySnap.data();
          const localRaw=localStorage.getItem(`75hard_${p}_day${d}`);
          const local=localRaw?JSON.parse(localRaw):defaultDayData();
          const merged={...local,...remote,photo1:local.photo1,photo2:local.photo2,photo3:local.photo3};
          localStorage.setItem(`75hard_${p}_day${d}`,JSON.stringify(merged));
        }
      }
      // 35 Hard days
      for(let d=1;d<=35;d++){
        const daySnap=await getDoc(doc(db,'35hard',`${p}_day${d}`));
        if(daySnap.exists()){
          const remote=daySnap.data();
          const localRaw=localStorage.getItem(`35hard_${p}_day${d}`);
          const local=localRaw?JSON.parse(localRaw):defaultDay35();
          const merged={...local,...remote,photo:local.photo};
          localStorage.setItem(`35hard_${p}_day${d}`,JSON.stringify(merged));
        }
      }
    }
    // Messages
    const msgsSnap=await getDoc(doc(db,'shared','messages'));
    if(msgsSnap.exists()){
      localStorage.setItem('75hard_couple_msgs',JSON.stringify(msgsSnap.data().msgs||[]));
    }
    showSyncStatus('✅ Synced!',true);
  }catch(e){
    console.warn('Initial sync error:',e);
    showSyncStatus('⚠️ Offline mode',false,true);
  }
  renderCurrentTab();
  startRealtimeSync();
}

function showSyncStatus(msg,fade=false,warn=false){
  let el=document.getElementById('syncStatus');
  if(!el){
    el=document.createElement('div');
    el.id='syncStatus';
    el.style.cssText='position:fixed;bottom:16px;right:16px;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:6px 14px;font-size:11px;font-weight:700;letter-spacing:1px;z-index:500;transition:opacity 0.5s;color:var(--green);';
    document.body.appendChild(el);
  }
  el.textContent=msg;
  el.style.color=warn?'var(--accent)':'var(--green)';
  el.style.opacity='1';
  if(fade)setTimeout(()=>el.style.opacity='0',2000);
}

let timerInterval=null, timerSeconds=0, timerTarget=2700, timerRunning=false, timerWorkoutNum=1;

// ═══════════════════════════════════════════
//  STATS HELPERS
// ═══════════════════════════════════════════
function getTodayDayNum(p){const m=getMeta(p);if(!m.startDate)return 1;const s=new Date(m.startDate),t=new Date();s.setHours(0,0,0,0);t.setHours(0,0,0,0);return Math.min(Math.max(Math.floor((t-s)/86400000)+1,1),75);}
function formatDate(d,p){const m=getMeta(p);if(!m.startDate)return '';const dt=new Date(m.startDate);dt.setDate(dt.getDate()+d-1);return dt.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});}
function isDayComplete(d){return d.diet&&d.workout1&&d.workout2&&d.water>=8&&d.pages>=10&&d.photo1;}
function isDayPartial(d){return [d.diet,d.workout1,d.workout2,d.water>=8,d.pages>=10,d.photo1].some(Boolean);}

function getCompleteDays(p){const dn=getTodayDayNum(p);let c=0;for(let d=1;d<dn;d++){if(isDayComplete(getDayData(p,d)))c++;}return c;}
function getStreak(p){const dn=getTodayDayNum(p);let best=0,cur=0;for(let d=1;d<dn;d++){if(isDayComplete(getDayData(p,d))){cur++;best=Math.max(best,cur);}else cur=0;}return best;}
function getCurStreak(p){const dn=getTodayDayNum(p);let cur=0;for(let d=dn-1;d>=1;d--){if(isDayComplete(getDayData(p,d)))cur++;else break;}return cur;}
function getTotalPages(p){const dn=getTodayDayNum(p);let t=0;for(let d=1;d<dn;d++)t+=getDayData(p,d).pages||0;return t;}
function getPhotoDays(p){const dn=getTodayDayNum(p);let c=0;for(let d=1;d<dn;d++){if(getDayData(p,d).photo1)c++;}return c;}
function getWaterStreak(p){const dn=getTodayDayNum(p);let best=0,cur=0;for(let d=1;d<dn;d++){if((getDayData(p,d).water||0)>=8){cur++;best=Math.max(best,cur);}else cur=0;}return best;}

function switchMode(m){
  activeMode=m;
  document.getElementById('modePill75').classList.toggle('active',m==='75');
  document.getElementById('modePill35').classList.toggle('active',m==='35');
  // Reset to today tab when switching modes
  activeTab='today';
  document.querySelectorAll('.nav-tab').forEach(n=>n.classList.remove('active'));
  document.querySelectorAll('.nav-tab')[0].classList.add('active');
  renderCurrentTab();
}
function switchPerson(p){activePerson=p;document.querySelectorAll('.person-tab').forEach(t=>t.classList.remove('active'));document.querySelector(`.person-tab.${p}`).classList.add('active');renderCurrentTab();}
function showTab(t){
  activeTab=t;
  if(t!=='timer'&&timerRunning){stopTimer();}
  document.querySelectorAll('.nav-tab').forEach(n=>n.classList.remove('active'));
  const tabs=['today','timer','overview','badges','history','compare','settings'];
  document.querySelectorAll('.nav-tab')[tabs.indexOf(t)].classList.add('active');
  renderCurrentTab();
}
function renderCurrentTab(){
  const c=document.getElementById('mainContent');
  // 35 HARD MODE — completely separate render path
  if(activeMode==='35'){
    render35CurrentTab(c);
    return;
  }
  // 75 HARD MODE
  const meta=getMeta(activePerson);
  const dayNum=getTodayDayNum(activePerson);
  document.getElementById('currentDayBadge').textContent=`DAY ${meta.startDate?dayNum:'?'}`;
  if(activeTab==='today')renderToday(c,dayNum);
  else if(activeTab==='timer')renderTimer(c);
  else if(activeTab==='overview')renderOverview(c);
  else if(activeTab==='badges')renderBadges(c);
  else if(activeTab==='history')renderHistory(c);
  else if(activeTab==='compare')renderCompare(c);
  else if(activeTab==='settings')renderSettings(c);
}

          const dn=getTodayDayNum(p);

          const done=[d.diet===true, d.workout1===true, d.workout2===true, (d.water||0)>=8, (d.pages||0)>=10, !!d.photo1].filter(Boolean).length;
          return `<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;">

            <div style="flex:1;height:8px;background:var(--border);border-radius:4px;overflow:hidden;"><div style="height:100%;width:${done/6*100}%;background:${p==='taki'?'var(--taki)':'var(--jessica)'};border-radius:4px;transition:width 0.3s;"></div></div>
            <span style="font-size:12px;font-weight:700;color:${done===6?'var(--green)':'var(--muted)'};">${done}/6${done===6?' ✓':''}</span>
          </div>`;
        }).join('')}
      </div>
    </div>
  `;
}

function setTimerPreset(secs){
  if(timerRunning)return;
  timerTarget=secs;
  timerSeconds=0;
  renderTimer(document.getElementById('mainContent'));
}
function startTimer(){
  if(timerSeconds>=timerTarget){timerSeconds=0;}
  timerRunning=true;
  timerInterval=setInterval(()=>{
    timerSeconds++;
    if(timerSeconds>=timerTarget){
      timerRunning=false;clearInterval(timerInterval);
      showToast('⏱ 45 MINUTES DONE! Mark your workout!','gold');
      notifyUser('75 HARD Timer','Workout complete! Mark it done in the tracker 💪');
      renderTimer(document.getElementById('mainContent'));
      return;
    }
    renderTimer(document.getElementById('mainContent'));
  },1000);
  renderTimer(document.getElementById('mainContent'));
}
function stopTimer(){timerRunning=false;clearInterval(timerInterval);renderTimer(document.getElementById('mainContent'));}
function resetTimer(){timerRunning=false;clearInterval(timerInterval);timerSeconds=0;renderTimer(document.getElementById('mainContent'));}
function markWorkoutFromTimer(wNum){
  const dayNum=getTodayDayNum(activePerson);
  const data=getDayData(activePerson,dayNum);
  const wasOn=data[`workout${wNum}`];
  data[`workout${wNum}`]=!wasOn;
  saveDayData(activePerson,dayNum,data);
  if(!wasOn){showToast(`💪 Workout #${wNum} marked complete!`);checkMilestones();}
  else showToast(`Workout #${wNum} unmarked`);
  renderTimer(document.getElementById('mainContent'));
}

function renderDaysGrid(){

    html+=`<div class="day-dot ${cls}" ${d<=dayNum&&meta.startDate?`onclick="jumpToDay(${d})"`:''}>
      ${[7,14,21,30,45,60,75].includes(d)?`<span title="Milestone">${d}</span>`:d}

function toggleEditTask(key,d){
  window._editDayData[key]=!window._editDayData[key];
  const el=document.getElementById(`edit_${key}`);
  const labels={diet:'Diet',workout1:'WO1',workout2:'WO2'};
  const icons={diet:'🥗',workout1:'💪',workout2:'🌤️'};
  const on=window._editDayData[key];
  el.style.border=`2px solid ${on?'var(--green)':'var(--border)'}`;
  el.style.background=on?'rgba(6,214,160,0.15)':'var(--surface2)';
  el.style.color=on?'var(--green)':'var(--muted)';
  el.innerHTML=`${icons[key]}<br>${on?'✓ '+labels[key]:labels[key]}`;
}

function setEditWater(d,cups){
  const current=window._editDayData.water||0;
  window._editDayData.water=current===cups?cups-1:cups;
  for(let i=0;i<8;i++){
    const cup=document.getElementById(`editcup_${i}`);
    if(cup){
      const filled=i<window._editDayData.water;
      cup.style.border=`2px solid ${filled?'var(--blue)':'var(--border)'}`;
      cup.style.background=filled?'var(--blue)':'var(--surface2)';
      cup.textContent=filled?'🥤':'🫙';
    }
  }
}

function saveEditDay(d){
  const data=getDayData(activePerson,d);
  data.diet=window._editDayData.diet;
  data.workout1=window._editDayData.workout1;
  data.workout2=window._editDayData.workout2;
  data.water=window._editDayData.water||0;
  data.pages=parseInt(document.getElementById('editPages')?.value)||0;
  data.book=document.getElementById('editBook')?.value||data.book;
  data.notes=document.getElementById('editNotes')?.value||'';
  saveDayData(activePerson,d,data);
  closeModal();
  showToast(`✏️ Day ${d} updated!`);

  for(let d=1;d<dayT;d++){const dd=getDayData('taki',d);if(isDayComplete(dd)){doneT++;sT++;streakT=Math.max(streakT,sT);}else sT=0;waterT+=dd.water||0;pagesT+=dd.pages||0;if(dd.mood){moodT+=dd.mood;moodCT++;}}

  const maxD=Math.max(doneT,doneJ,1),maxS=Math.max(streakT,streakJ,1),maxW=Math.max(waterT,waterJ,1),maxP=Math.max(pagesT,pagesJ,1);
  const avgMoodT=moodCT>0?(moodT/moodCT).toFixed(1):0;
  const avgMoodJ=moodCJ>0?(moodJ/moodCJ).toFixed(1):0;

  c.innerHTML=`
    <div class="compare-card">
      <div class="compare-title">⚔️ HEAD TO HEAD</div>
      ${cRow('Perfect Days',doneT,doneJ,maxD)}
      ${cRow('Best Streak 🔥',streakT,streakJ,maxS)}
      ${cRow('Water Cups 💧',waterT,waterJ,maxW)}
      ${cRow('Pages Read 📖',pagesT,pagesJ,maxP)}
    </div>
    <div class="compare-card">
      <div class="compare-title">Avg Mood / Energy</div>
      <div style="display:flex;gap:12px;text-align:center;">
        <div style="flex:1;background:rgba(76,201,240,0.08);border:1px solid rgba(76,201,240,0.2);border-radius:10px;padding:12px;">
          <div style="font-size:11px;color:var(--taki);font-weight:700;letter-spacing:1px;margin-bottom:4px;">TAKI</div>
          <div style="font-family:'Black Ops One',cursive;font-size:30px;color:var(--taki);">${avgMoodT}</div>
          <div style="font-size:18px;">${avgMoodT>=4?'🔥':avgMoodT>=3?'🙂':avgMoodT>=2?'😐':'😕'}</div>
        </div>

function getTodayDay35(p){
  const m=getMeta35(p);
  if(!m.startDate)return 1;
  const s=new Date(m.startDate),t=new Date();
  s.setHours(0,0,0,0);t.setHours(0,0,0,0);
  return Math.min(Math.max(Math.floor((t-s)/86400000)+1,1),35);
}
function formatDate35(d,p){
  const m=getMeta35(p);
  if(!m.startDate)return '';
  const dt=new Date(m.startDate);
  dt.setDate(dt.getDate()+d-1);
  return dt.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
}
function isDay35Complete(d){return d.clean&&d.noAlcohol&&d.water&&d.workout&&d.steps&&!!d.photo;}
function isDay35Partial(d){return [d.clean,d.noAlcohol,d.water,d.workout,d.steps,!!d.photo].some(Boolean);}
function getComplete35Days(p){const dn=getTodayDay35(p);let c=0;for(let d=1;d<dn;d++){if(isDay35Complete(getDay35Data(p,d)))c++;}return c;}
function getStreak35(p){const dn=getTodayDay35(p);let best=0,cur=0;for(let d=1;d<dn;d++){if(isDay35Complete(getDay35Data(p,d))){cur++;best=Math.max(best,cur);}else cur=0;}return best;}

  const m=MILESTONES.find(m=>m.day===dayNum);
  if(!m)return;

  const data=getDayData(activePerson,dayNum);

  if(dayNum===1||done===6){
    shownMilestones[key]=true;
    localStorage.setItem('75hard_milestones',JSON.stringify(shownMilestones));
    setTimeout(()=>showMilestone(m),600);
  }
  // Also fire a 6/6 daily completion celebration (non-milestone days)
  const dailyKey=`${activePerson}_daily_${dayNum}`;
  if(done===6&&!shownMilestones[dailyKey]&&!m){
    shownMilestones[dailyKey]=true;
    localStorage.setItem('75hard_milestones',JSON.stringify(shownMilestones));
    setTimeout(()=>launchConfetti(),400);
  }
}
function showMilestone(m){
  document.getElementById('milestoneEmoji').textContent=m.emoji;
  document.getElementById('milestoneTitle').textContent=m.title;
  document.getElementById('milestoneSub').textContent=m.sub;
  document.getElementById('milestonePopup').classList.remove('hidden');
  launchConfetti();
}
function closeMilestone(){document.getElementById('milestonePopup').classList.add('hidden');}

// CONFETTI
function launchConfetti(){
  const canvas=document.getElementById('confettiCanvas');
  const ctx=canvas.getContext('2d');
  canvas.width=window.innerWidth;canvas.height=window.innerHeight;
  const pieces=[];
  const colors=['#ff4d4d','#ffd166','#06d6a0','#4cc9f0','#ff8c42','#ffffff'];
  for(let i=0;i<120;i++){pieces.push({x:Math.random()*canvas.width,y:-10,w:Math.random()*10+5,h:Math.random()*6+3,color:colors[Math.floor(Math.random()*colors.length)],r:Math.random()*Math.PI*2,vx:(Math.random()-0.5)*4,vy:Math.random()*4+2,vr:(Math.random()-0.5)*0.2});}
  let frame=0;
  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    pieces.forEach(p=>{
      p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.vy+=0.05;
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.color;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore();
    });
    frame++;if(frame<200)requestAnimationFrame(draw);else ctx.clearRect(0,0,canvas.width,canvas.height);
  }
  draw();
}

// ═══════════════════════════════════════════
//  NOTIFICATIONS
// ═══════════════════════════════════════════
function requestNotifPermission(){
  if(!('Notification' in window)){showToast('Notifications not supported on this browser',true);return;}
  Notification.requestPermission().then(p=>{
    if(p==='granted'){showToast('🔔 Notifications enabled!');scheduleReminder();}
    else showToast('Notifications blocked',true);
  });
}
function notifyUser(title,body){
  if(Notification.permission==='granted')new Notification(title,{body,icon:'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">🔥</text></svg>'});
}
function scheduleReminder(){showToast('🔔 You\'ll get a reminder tonight if tasks are incomplete!');}

// ═══════════════════════════════════════════
//  EXPORT / IMPORT
// ═══════════════════════════════════════════
function exportData(p){
  const meta=getMeta(p);
  const dayNum=getTodayDayNum(p);
  const data={meta,days:{}};
  for(let d=1;d<=Math.max(dayNum,1);d++)data.days[d]=getDayData(p,d);
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`75hard_${p}_${new Date().toISOString().split('T')[0]}.json`;
  a.click();
  showToast('📦 Export downloaded!');
}
function importData(){
  const file=document.getElementById('importFile').files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const data=JSON.parse(e.target.result);
      if(!data.meta||!data.days){showToast('Invalid file',true);return;}
      // Try to detect which person
      openModal(`
        <div class="modal-handle"></div>
        <div class="modal-title">Import For Who?</div>
        <button onclick="doImport('taki')" style="width:100%;padding:13px;background:var(--taki);border:none;color:#000;border-radius:12px;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:16px;cursor:pointer;margin-bottom:8px;">TAKI</button>
        <button onclick="doImport('jessica')" style="width:100%;padding:13px;background:var(--jessica);border:none;color:#000;border-radius:12px;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:16px;cursor:pointer;margin-bottom:8px;">JESSICA</button>
        <button class="close-modal-btn" onclick="closeModal()">CANCEL</button>
      `);
      window._importData=data;
    }catch(err){showToast('Failed to read file',true);}
  };
  reader.readAsText(file);
}
function doImport(p){
  const data=window._importData;
  if(!data)return;
  saveMeta(p,data.meta);
  Object.entries(data.days).forEach(([d,dd])=>localStorage.setItem(KEY(p,d),JSON.stringify(dd)));
  closeModal();
  showToast('📂 Data imported!');
  renderCurrentTab();
}

// ═══════════════════════════════════════════
//  MODAL / TOAST
// ═══════════════════════════════════════════
function openModal(html){document.getElementById('modalBody').innerHTML=html;document.getElementById('modalOverlay').classList.remove('hidden');}
function closeModal(e){if(!e||e.target===document.getElementById('modalOverlay'))document.getElementById('modalOverlay').classList.add('hidden');}
let toastTimer;
function showToast(msg,type=false){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.className=`toast show${type===true?' bad':type==='gold'?' gold':''}`;
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),2600);
}

// ═══════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════
initTheme();
renderCurrentTab();
checkMilestones();
// Firebase loads AFTER the UI is fully rendered — never blocks buttons
setTimeout(()=>initFirebase(),100);
</script>
